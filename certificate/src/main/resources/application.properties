spring.application.name=certificate

# Configuração do Servidor / para evitar conflito de portas com outros microserviços
server.port=8084

# URL de conexão com o banco de dados (o SQLite criará o arquivo 'progress.db' se ele não existir)
spring.datasource.url=jdbc:sqlite:certificate.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
# Dialeto do Hibernate para SQLite
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
# DDL: Cria e atualiza a estrutura do banco/tabelas automaticamente com base nas @Entity
spring.jpa.hibernate.ddl-auto=update
# Exibe os comandos SQL gerados no console (opcional)
spring.jpa.show-sql=false

# Mensageria (RabbitMQ)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123